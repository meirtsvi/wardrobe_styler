name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx firebase emulators:exec --only firestore --project demo-wardrobe "npx vitest run --config vitest.emu.config.ts"

  ios-domain:
    # PLAN §6 CI/CD: macos-26 runner, Xcode 26.x. fastlane (via Gemfile + bundle exec) joins when the app target exists.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app || true
      - run: swift --version
      - run: swift test
        working-directory: ios/Packages/Domain
      - run: swift test
        working-directory: ios/Packages/OnDeviceAI
      - run: swift test
        working-directory: ios/Packages/Digitize
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -project WardrobeStyler.xcodeproj -scheme WardrobeStyler -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
